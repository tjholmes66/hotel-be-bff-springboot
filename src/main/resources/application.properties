spring.application.name=hotel-be-bff-springboot

# Angular UI base URL used for login success/failure and logout redirects
app.ui.base-url=${HOTEL_BFF_UI_BASE_URL:http://localhost:4200}
app.ui.login-path=/login

# Origin(s) allowed to call this BFF with the session cookie (comma separated)
app.cors.allowed-origins=${HOTEL_BFF_CORS_ALLOWED_ORIGINS:${app.ui.base-url}}

# BFF session / JSESSIONID settings
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${HOTEL_BFF_SESSION_COOKIE_SECURE:false}

# 1. Spring Boot - Hibernate6 settings
#spring.datasource.url=jdbc:mysql://127.0.0.1:3306/job_search_db?serverTimezone=UTC
spring.datasource.url=${HOTEL_BFF_DB_URL}?dontTrackSessionChanges=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${HOTEL_BFF_USERNAME}
spring.datasource.password=${HOTEL_BFF_PASSWORD}
spring.jpa.generate-ddl=false

# 2. Disable Hibernate Schema Manipulation (Crucial for existing data)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# 3. Flyway Baseline Configuration
spring.flyway.enabled=true
# Tells Flyway to create a metadata table if it doesn't exist
spring.flyway.baseline-on-migrate=true
# The version to label your existing database state (e.g., 0 or 1)
spring.flyway.baseline-version=1
# The description recorded for this baseline state
spring.flyway.baseline-description=Existing database baseline

# For Flyway Maven Plugin
flyway.url=${HOTEL_BFF_DB_URL}?dontTrackSessionChanges=true&allowPublicKeyRetrieval=true&useSSL=false
flyway.user=${HOTEL_BFF_USERNAME}
flyway.password=${HOTEL_BFF_PASSWORD}

# For ThymeLeaf and HTMX Pages
spring.thymeleaf.cache=false

# Registration Details (Replace 'my-keycloak-client' and 'your-client-secret')
spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-id=hotel_client
spring.security.oauth2.client.registration.keycloak.client-secret=${HOTEL_BFF_KEYCLOAK_SECRET}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code

# Tell Keycloak where to send the user back to (Spring's internal endpoint)
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Tell Spring Security where to send the user to login
spring.security.oauth2.client.provider.keycloak.authorization-uri=http://localhost:9000/realms/hotel_realm/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=http://localhost:9000/realms/hotel_realm/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.user-info-uri=http://localhost:9000/realms/hotel_realm/protocol/openid-connect/userinfo

# Provider Details (Replace with your Keycloak server host, port, and realm name)
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:9000/realms/hotel_realm
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=http://localhost:9000/realms/hotel_realm/protocol/openid-connect/certs

# logging levels
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.client.RestTemplate=DEBUG
